name: Krovi verification

on:
  push:
    branches: ["main", "rebuild/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Server smoke test
        run: npm run test:server
      - name: Production Connect smoke test
        run: node scripts/connect-production-smoke.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
